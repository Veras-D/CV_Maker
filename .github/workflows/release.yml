name: Release Multi-Platform Desktop Applications

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Package Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: Produces .AppImage and .deb
          - platform: 'ubuntu-22.04'
            args: ''

          # macOS: Produces Universal / Apple Silicon & Intel .dmg
          - platform: 'macos-latest'
            args: ''

          # Windows: Produces .msi installer and .exe (NSIS)
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GTK & AppImage Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            squashfs-tools \
            file \
            xdg-utils

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Quality Gate Checks
        run: |
          npm run typecheck
          npm run lint

      - name: Build & Publish Release via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CV Maker & Role Tracker ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 CV Maker & Role Tracker ${{ github.ref_name }}
            
            Multi-platform desktop binaries are ready to download:
            - **Linux**: `.AppImage` (portable standalone) and `.deb` (Debian/Ubuntu)
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Windows**: `.msi` and `.exe` (NSIS Installer)
            
            ### ✨ Features Included:
            - ATS-Optimized Pure Vector Resume & PDF Export
            - Drag-and-Drop Role Tracking Kanban Board
            - AI Keyword & Role Tailoring Engine
            - Dark Slate UI with Custom Date & Currency Controls
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
