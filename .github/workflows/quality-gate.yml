name: Quality Gate & Automated CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Automated Quality & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: 'Gate 1: TypeScript Strict Typecheck'
        run: npm run typecheck

      - name: 'Gate 2: Static Analysis & Cyclomatic Complexity'
        run: npm run lint

      - name: 'Gate 3: Code Duplication & Clone Detection'
        run: npm run quality:duplication

      - name: 'Gate 4: Security Gate (Dependencies & Secret Scanning)'
        run: |
          echo "Scanning dependencies for known CVEs and vulnerabilities..."
          npm run quality:audit
        
      - name: 'Gate 4: Security Gate (Gitleaks Secret & Token Scanning)'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Gate 5: Production Build Verification'
        run: npm run build
