name: Quality Gate & Automated CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Code Quality, Complexity & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 'Gate 1: TypeScript Strict Typecheck'
        run: npm run typecheck

      - name: 'Gate 2: Static Analysis, Complexity & AST Security'
        run: npm run lint

      - name: 'Gate 3: Code Duplication & Clone Detection'
        run: npm run quality:duplication

      - name: 'Gate 4: Secret & Token Leak Detection (Gitleaks)'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Gate 5: Production Build Verification'
        run: npm run build
